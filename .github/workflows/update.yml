name: Daily Data Update

on:
  repository_dispatch:
    types: [manual-update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_run:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Project
        run: dotnet build TWETA/TWETA.csproj

      - name: Install Playwright Browsers
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path "TWETA/bin" -Filter "playwright.ps1" -Recurse | Select-Object -First 1
          if ($script) {
              Write-Host "Found script at: $($script.FullName)"
              & $script.FullName install chromium
          } else {
              Write-Error "playwright.ps1 파일을 찾을 수 없습니다. 빌드가 성공했는지 확인하세요."
              exit 1
          }

      - name: Run Scraper
        run: dotnet run --project TWETA/TWETA.csproj

      - name: Commit and Push changes
        shell: bash
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f eta_ranking.json ]; then
            echo "eta_ranking.json 파일이 없습니다."
            exit 0
          fi

          git add eta_ranking.json
          [ -f eta_history.json ] && git add eta_history.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
