# 매일 사이트의 "Last Update"가 바뀐 직후 에타 랭킹을 수집해 커밋한다.
#
# 실행은 외부 크론(cron-job.org "TWETA Update" → repository_dispatch: manual-update)이 매일 08:00 KST에 건다.
# GitHub schedule은 매일 2시간쯤 밀려 시작돼(08:00 지정 → 실제 10시경) 쓰지 않는다.
# 사이트는 보통 08:00~08:30 KST에 갱신되므로 5분 간격으로 Last Update를 확인하고, 바뀌면 그때 수집한다(최대 4시간).
# 화면에서 직접 돌리는 workflow_dispatch만 기다리지 않고, Last Update가 마지막 수집분과 같으면 건너뛴다.
name: Daily Data Update

on:
  repository_dispatch:
    types: [manual-update]
  workflow_dispatch:
    inputs:
      force:
        description: "사이트 Last Update가 마지막 수집분과 같아도 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write

# 예약 실행이 대기 중일 때 외부 호출이 겹쳐 같은 날 두 번 수집하지 않게 한다 (뒤 실행은 순서를 기다렸다가 건너뜀).
concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  build_and_run:
    runs-on: windows-latest
    # 최대 대기(240분) + 수집(약 20분) + 준비 여유
    timeout-minutes: 330
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ETA_WAIT_FOR_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      ETA_POLL_INTERVAL_MIN: "5"
      ETA_WAIT_MAX_MIN: "240"
      ETA_FORCE: ${{ inputs.force == true && '1' || '0' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Project
        run: dotnet build TWETA/TWETA.csproj

      - name: Install Playwright Browsers
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path "TWETA/bin" -Filter "playwright.ps1" -Recurse | Select-Object -First 1
          if ($script) {
              Write-Host "Found script at: $($script.FullName)"
              & $script.FullName install chromium
          } else {
              Write-Error "playwright.ps1 파일을 찾을 수 없습니다. 빌드가 성공했는지 확인하세요."
              exit 1
          }

      - name: Run Scraper
        run: dotnet run --project TWETA/TWETA.csproj --no-build

      - name: Commit and Push changes
        shell: bash
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f eta_ranking.json ]; then
            echo "eta_ranking.json 파일이 없습니다."
            exit 0
          fi

          # 러너는 UTC라 date를 그대로 쓰면 08시대 실행이 전날로 찍힌다. KST 기준 날짜를 쓴다.
          TODAY=$(date -u -d '+9 hours' +'%Y-%m-%d')

          git add eta_ranking.json
          [ -f eta_history.json ] && git add eta_history.json
          [ -f eta_meta.json ] && git add eta_meta.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $TODAY"
          fi

          git pull --rebase origin main

          # 날짜 → 커밋 SHA 인덱스 갱신. 오늘 수집이 없었어도(갱신 없음/건너뜀) 최신 eta_ranking.json을 담은 커밋을 기록한다.
          SHA=$(git log -1 --format=%H -- eta_ranking.json)
          [ -f ranking_index.json ] || echo '{}' > ranking_index.json
          jq --arg d "$TODAY" --arg s "$SHA" '.[$d] = $s' ranking_index.json > tmp_index.json
          mv tmp_index.json ranking_index.json
          git add ranking_index.json

          if git diff --cached --quiet; then
            echo "Index unchanged"
          else
            git commit -m "Index: $TODAY"
          fi

          git push origin HEAD:main
